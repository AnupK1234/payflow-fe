<div class="not-found-container d-flex flex-column justify-content-center align-items-center text-center p-5">
    <h1 class="display-4 text-primary-dark mb-3">404 - Page Not Found</h1>
    <p class="lead text-medium-gray mb-4">
        Oops! The page you're looking for doesn't exist.
    </p>
    <button class="btn btn-primary-gradient px-4 py-2" (click)="goHome()">
        Return to Home Page
    </button>
    <p class="text-muted mt-3">
        You will be redirected automatically in {{ countdown }} seconds...
    </p>
</div>
