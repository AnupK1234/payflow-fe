<!-- reset-password.component.html -->
<div class="reset-password-container">
  <div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">

            <!-- Header -->
            <div class="text-center mb-4">
              <div class="icon-box bg-warning-subtle text-warning mx-auto mb-3">
                <i class="bi bi-shield-lock fs-1"></i>
              </div>
              <h4 class="fw-bold mb-2">Reset Your Password</h4>
              <p class="text-muted">Follow the 3 steps to reset your password</p>
            </div>

            <!-- Alerts -->
            <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
              <button type="button" class="btn-close" (click)="errorMessage=''"></button>
            </div>
            <div *ngIf="successMessage" class="alert alert-success fade show">
              <i class="bi bi-check-circle-fill me-2"></i>{{ successMessage }}
            </div>

            <!-- Step 1: Email -->
            <form *ngIf="currentStep==='email'" [formGroup]="emailForm" (ngSubmit)="sendOTP()">
              <div class="mb-3">
                <label class="form-label fw-semibold">Registered Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                  <input type="email" formControlName="email" class="form-control border-start-0"
                         placeholder="Enter your email" [class.is-invalid]="isFieldInvalid(emailForm,'email')">
                </div>
                <div *ngIf="isFieldInvalid(emailForm,'email')" class="invalid-feedback d-block">
                  Please enter a valid email
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold" [disabled]="isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                <i *ngIf="!isLoading" class="bi bi-send me-2"></i> Send OTP
              </button>
            </form>

            <!-- Step 2: OTP -->
            <form *ngIf="currentStep==='otp'" [formGroup]="otpForm" (ngSubmit)="verifyOTP()">
              <div class="mb-3">
                <label class="form-label fw-semibold">Enter OTP</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                  <input #otpInput type="text" formControlName="otp" class="form-control border-start-0"
                         placeholder="Enter the OTP" [class.is-invalid]="isFieldInvalid(otpForm,'otp')">
                </div>
                <div *ngIf="isFieldInvalid(otpForm,'otp')" class="invalid-feedback d-block">
                  Please enter a valid OTP
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold" [disabled]="isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                <i *ngIf="!isLoading" class="bi bi-check2-circle me-2"></i> Verify OTP
              </button>

              <div class="d-flex justify-content-between align-items-center mt-2">
                <small *ngIf="otpTimer>0">OTP expires in {{ getTimerDisplay() }}</small>
                <a href="#" class="ms-2" (click)="resendOTP(); $event.preventDefault()"
                   [class.disabled]="isLoading || otpTimer>0">Resend OTP</a>
              </div>
            </form>

            <!-- Step 3: Reset Password -->
            <form *ngIf="currentStep==='password'" [formGroup]="passwordForm" (ngSubmit)="resetPassword()">
              <div class="mb-3">
                <label class="form-label fw-semibold">New Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                  <input [type]="showNewPassword?'text':'password'" formControlName="newPassword"
                         class="form-control border-start-0" placeholder="Enter new password"
                         [class.is-invalid]="isFieldInvalid(passwordForm,'newPassword')">
                  <span class="input-group-text cursor-pointer" (click)="togglePasswordVisibility('new')">
                    <i [class]="showNewPassword?'bi bi-eye-slash':'bi bi-eye'"></i>
                  </span>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill"></i></span>
                  <input [type]="showConfirmPassword?'text':'password'" formControlName="confirmPassword"
                         class="form-control border-start-0"
                         [class.is-invalid]="passwordForm.hasError('passwordMismatch')"
                         placeholder="Re-enter password">
                  <span class="input-group-text cursor-pointer" (click)="togglePasswordVisibility('confirm')">
                    <i [class]="showConfirmPassword?'bi bi-eye-slash':'bi bi-eye'"></i>
                  </span>
                </div>
                <div *ngIf="passwordForm.hasError('passwordMismatch')" class="invalid-feedback d-block">
                  Passwords do not match
                </div>
              </div>

              <button type="submit" class="btn btn-success w-100 py-3 fw-semibold" [disabled]="isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                <i *ngIf="!isLoading" class="bi bi-check-circle me-2"></i> Reset Password
              </button>
            </form>

          </div>
        </div>

        <div class="alert alert-light mt-4 text-center">
          <i class="bi bi-shield-check text-primary me-2"></i>
          <small class="text-muted">Your password is encrypted and secure. Never share it with anyone.</small>
        </div>
      </div>
    </div>
  </div>
</div>
