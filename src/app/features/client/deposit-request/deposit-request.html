<div class="container mx-auto mt-6 max-w-md">
  <h2 class="text-2xl font-semibold mb-4">Raise Deposit Request</h2>

  <div class="mb-4">
    <label class="block mb-1 font-medium">Amount (₹)</label>
    <input type="number" [(ngModel)]="amount" class="w-full p-2 border rounded" placeholder="Enter amount">
  </div>

  

  <button (click)="submitDeposit()" [disabled]="isLoading" class="bg-blue-500 text-white px-4 py-2 rounded">
    {{ isLoading ? 'Submitting...' : 'Submit' }}
  </button>

  <div *ngIf="successMessage" class="text-green-600 mt-2">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="text-red-600 mt-2">{{ errorMessage }}</div>
</div>
