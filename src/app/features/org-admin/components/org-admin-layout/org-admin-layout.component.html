<app-shared-navbar></app-shared-navbar>

<div class="bank-admin-root d-flex vh-100">
    <!-- Sidebar -->
    <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
        @if (!sidebarCollapsed) {
        <div class="sidebar-header p-3 d-flex align-items-center justify-content-between">
            <div>
                <h5 class="m-0">Organization Admin</h5>
                <small class="text-muted">Dashboard</small>
            </div>
            <button class="btn btn-sm btn-link" (click)="toggleSidebar()" aria-label="Collapse sidebar">☰</button>
        </div>

        <nav class="nav flex-column p-2">
            <a class="nav-link" routerLink="/organization/dashboard" routerLinkActive="active">Dashboard</a>
            <a class="nav-link" routerLink="/organization/employees" routerLinkActive="active">All Employee</a>
            <a class="nav-link" routerLink="/organization/dashboard" routerLinkActive="active">Batch Employee Creation</a>
            <a class="nav-link" routerLink="/organization/dashboard" routerLinkActive="active">Salary Disburment</a>
            <a class="nav-link" routerLink="/organization/dashboard" routerLinkActive="active">See Employee concerns</a>
        </nav>
        } @else {
        <button class="btn btn-link m-2" (click)="toggleSidebar()" aria-label="Open sidebar">☰</button>
        }
    </aside>

    <!-- Main content area -->
    <main class="content flex-grow-1 p-3">
        <router-outlet></router-outlet>
    </main>

</div>
