<div class="container mt-4">
  <h2 class="mb-4 text-center">Raise a Concern</h2>

  <form [formGroup]="concernForm" (ngSubmit)="submitConcern()" class="p-4 shadow-sm bg-light rounded">

    
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" class="form-control"
                formControlName="description" rows="4"
                placeholder="Enter concern details"
                [class.is-invalid]="description.invalid && description.touched"></textarea>
      <div *ngIf="description.invalid && description.touched" class="text-danger small">
        Description is required.
      </div>
      <div *ngIf="description.errors?.['serverError']?.[0]" class="text-danger small">
        {{ description.errors?.['serverError']?.[0] }}
      </div>
    </div>

   
    <div class="mb-3">
      <label for="attachment" class="form-label">Attachment (optional)</label>
      <input type="file" id="attachment" class="form-control" (change)="onFileSelected($event)">
      <div *ngIf="fileName" class="small text-muted mt-1">
        Selected file: {{ fileName }}
      </div>
    </div>

   
    <div *ngIf="statusMessage()" 
         [class.text-success]="submissionStatus() === 'success'"
         [class.text-danger]="submissionStatus() === 'error'" 
         class="mb-3 text-center">
      {{ statusMessage() }}
    </div>

   
    <div class="text-center">
      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting() || concernForm.invalid">
        {{ isSubmitting() ? 'Submitting...' : 'Submit Concern' }}
      </button>
    </div>

  </form>
</div>
