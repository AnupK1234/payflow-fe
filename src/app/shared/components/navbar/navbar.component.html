<nav class="navbar navbar-expand bg-white shadow-sm py-2 px-3 border-bottom sticky-top">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center" (click)="goHome()" style="cursor:pointer">
            <i class="bi bi-cash-coin fs-4 text-primary me-2"></i>
            <span class="fw-bold fs-5 text-dark">PayFlow</span>
        </a>

        <div class="d-flex align-items-center gap-3">

            <!-- Notifications -->
            <div class="dropdown">
                <button class="btn btn-light position-relative rounded-circle shadow-sm" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <i class="bi bi-bell fs-5 text-secondary"></i>
                    @if (notifications.length > 0) {
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger small">
                        {{ notifications.length }}
                    </span>
                    }
                </button>

                <ul class="dropdown-menu dropdown-menu-end shadow-sm notif-dropdown">
                    <li class="dropdown-header fw-semibold">Notifications</li>

                    @if (notifications.length === 0) {
                    <li class="px-3 text-muted small py-2">No new notifications</li>
                    }

                    @for (n of notifications; track n.id) {
                    <li class="dropdown-item d-flex justify-content-between align-items-start">
                        <div>
                            <div class="fw-semibold small">{{ n.title }}</div>
                            <div class="text-muted small">{{ n.message }}</div>
                        </div>
                        <button class="btn btn-sm btn-link p-0 text-success" (click)="markAsRead(n)">
                            <i class="bi bi-check2-circle fs-6"></i>
                        </button>
                    </li>
                    }
                </ul>
            </div>

            <!-- User -->
            <div class="dropdown">
                <button class="btn btn-outline-light border-0" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="https://avatar.iran.liara.run/public" class="rounded-circle border" alt="avatar"
                        width="34" height="34" />
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm user-dropdown">
                    <li class="px-3 py-2 border-bottom">
                        <div class="fw-bold">{{ user?.username || 'Guest' }}</div>
                        <div class="small text-muted">{{ user?.email || 'Not logged in' }}</div>
                    </li>
                    <li>
                        <button class="dropdown-item text-danger" (click)="logout()">
                            <i class="bi bi-box-arrow-right me-2"></i> Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
